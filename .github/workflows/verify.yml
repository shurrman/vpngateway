name: verify

on:
  push:
  pull_request:

jobs:
  test:
    if: github.repository == 'shurrman/vpngateway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python3 -m compileall -q api scripts
      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh packaging/*.sh packaging/vpngateway-install
      - name: Go tests
        run: go test ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Public tree policy
        run: |
          test ! -e MEMORY.md
          test ! -e AGENTS.md
          test ! -e CLAUDE.md
          test ! -e CHANGELOG.md
          test ! -e PLAN.md
          test ! -e QUICKSTART.md
          test "$(find . -type f -name '*.md' | wc -l)" -eq 4
          test -f LICENSE
          ! git grep -n -E 'BEGIN (OPENSSH|RSA|EC|PRIVATE) PRIVATE KEY'

  mobile:
    if: github.repository == 'shurrman/vpngateway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Flutter analysis
        working-directory: mobile
        run: flutter analyze
      - name: Flutter tests
        working-directory: mobile
        run: flutter test

  packages:
    if: github.repository == 'shurrman/vpngateway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Build release packages
        run: packaging/build-release.sh "$(sed -n 's/^API_VERSION = "\([^"]*\)"/\1/p' api/config.py)" dist
      - name: Verify release packages
        run: packaging/verify-release.sh "$(sed -n 's/^API_VERSION = "\([^"]*\)"/\1/p' api/config.py)" dist
